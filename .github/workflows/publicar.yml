name: Publicar
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
concurrency:
  group: lc-publicador
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar o que está na hora
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PUBLICAR_FACEBOOK: ${{ vars.PUBLICAR_FACEBOOK }}
          MIDIA_URL_BASE: ${{ vars.MIDIA_URL_BASE }}
        run: python -m publicador.executar
      - name: Salvar resultado
        run: |
          if ! git diff --quiet -- fila.json; then
            python -m publicador.painel
            git config user.name "LC Publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add fila.json registro.log index.html
            git commit -m "Publicações $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git pull --rebase && git push
          fi
