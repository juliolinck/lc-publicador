name: Importar calendario
on:
  push:
    paths:
      - "entrada/**"
  workflow_dispatch:
concurrency:
  group: lc-publicador
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Importar planilha e postagens da pasta entrada
        run: |
          shopt -s nullglob
          planilhas=(entrada/*.xlsx)
          if [ ${#planilhas[@]} -eq 0 ]; then echo "Nenhuma planilha .xlsx em entrada/"; exit 0; fi
          python -m publicador.importar "${planilhas[0]}" entrada --desde "$(TZ=America/Sao_Paulo date +%F)"
          python -m publicador.painel
          find entrada -type f ! -name .gitkeep -delete
          find entrada -mindepth 1 -type d -empty -delete
          git config user.name "LC Publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add -A
          git commit -m "Calendário importado $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" || exit 0
          git pull --rebase && git push
