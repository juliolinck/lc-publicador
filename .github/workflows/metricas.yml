name: Metricas
on:
  schedule:
    - cron: "47 11 * * *"   # todo dia por volta das 8h47 de Brasília
  workflow_dispatch:
concurrency:
  group: lc-publicador
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar seguidores e números dos posts
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -m publicador.metricas
          python -m publicador.painel
      - name: Salvar
        run: |
          git config user.name "LC Publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add metricas.json registro.log index.html; git add estado.json 2>/dev/null || true
          git commit -m "Métricas $(TZ=America/Sao_Paulo date '+%d/%m')" || exit 0
          git pull --rebase && git push
