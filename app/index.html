<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LC Publicador</title>
<meta name="theme-color" content="#4A3324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LC Publicador">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<style>
:root{--creme:#F4ECDF;--creme2:#EADFCB;--creme3:#FBF7F0;--marrom:#4A3324;--marrom2:#7A5A42;--ouro:#A8834F;--ok:#3F7D4E;--erro:#B3412E;--pend:#8A7A66;--sombra:0 6px 24px rgba(74,51,36,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--marrom);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--marrom2)}
header{position:sticky;top:0;z-index:5;background:var(--marrom);color:var(--creme);padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.topo{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.topo h1{margin:0;font:600 20px Georgia,serif;letter-spacing:.3px;flex:1}
.topo small{display:block;font:12px Inter,Arial,sans-serif;opacity:.75;letter-spacing:0}
.icone{background:none;border:1px solid rgba(244,236,223,.35);color:var(--creme);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.icone svg{width:18px;height:18px}
.girando svg{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
nav{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--creme);opacity:.7;padding:10px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--ouro);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
.aviso{display:none;align-items:center;gap:10px;background:var(--marrom2);color:var(--creme);padding:10px 16px;font-size:14px}
.aviso.on{display:flex}.aviso .ponto{width:9px;height:9px;border-radius:50%;background:var(--ouro);animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.3}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--creme3);border:1px solid var(--creme2);border-radius:14px;padding:14px}
.card>b{display:block;font:600 26px Georgia,serif;margin:2px 0}
.card small{color:var(--marrom2)}
.barra{height:8px;background:var(--creme2);border-radius:6px;overflow:hidden;margin-top:8px}.barra i{display:block;height:100%;background:var(--ouro)}
h2{font:600 18px Georgia,serif;margin:22px 0 10px}
.proximo{display:flex;gap:14px;align-items:center;background:var(--marrom);color:var(--creme);border-radius:14px;padding:14px;cursor:pointer;border:0;width:100%;text-align:left}
.proximo img{width:64px;height:80px;object-fit:cover;border-radius:8px;background:var(--marrom2);flex:none}
.proximo small{opacity:.75;display:block}.proximo strong{font:600 17px Georgia,serif;display:block;margin:2px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chips button{border:1px solid var(--marrom2);background:none;border-radius:20px;padding:6px 14px}
.chips button.on{background:var(--marrom);color:var(--creme);border-color:var(--marrom)}
.busca{width:100%;padding:10px 14px;border:1px solid var(--creme2);border-radius:12px;background:var(--creme3);margin-bottom:10px}
.dia{background:var(--creme3);border:1px solid var(--creme2);border-radius:14px;margin-bottom:10px;padding:6px 12px}
.dia h3{margin:6px 0;font:600 13px Inter,Arial,sans-serif;color:var(--marrom2);text-transform:capitalize}
.post{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--creme2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.dia h3+.post{border-top:0}
.post img,.post .sem{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--creme2);flex:none}
.hora{font-variant-numeric:tabular-nums;width:44px;flex:none;font-weight:600}
.tit{flex:1;min-width:0}.tit div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tit span{display:block;font-size:12px;color:var(--marrom2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;border-radius:12px;padding:2px 10px;white-space:nowrap;color:#fff;flex:none}
.st.publicado{background:var(--ok)}.st.pendente{background:var(--pend)}.st.erro,.st.perdido{background:var(--erro)}.st.pausado{background:var(--ouro)}.st.aplicando{background:var(--marrom2)}
.vazio{padding:20px;text-align:center;color:var(--marrom2)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--marrom);color:var(--creme);font-weight:600}
.btn.sec{background:none;border:1px solid var(--marrom2);color:var(--marrom)}
.btn.perigo{background:none;border:1px solid var(--erro);color:var(--erro)}
.btn.ouro{background:var(--ouro);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.linha{display:flex;gap:8px;flex-wrap:wrap}
.linha>*{flex:1 1 140px}
dialog{border:0;padding:0;border-radius:18px;width:min(640px,100vw);max-height:92vh;background:var(--creme);color:var(--marrom);box-shadow:var(--sombra)}
dialog::backdrop{background:rgba(40,26,17,.45)}
@media (max-width:640px){dialog{margin:auto 0 0;width:100vw;max-width:100vw;max-height:94vh;border-radius:18px 18px 0 0}}
.folha{padding:18px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-height:inherit}
.folha header{all:unset;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.folha header h2{margin:0;flex:1}
.fechar{background:var(--creme2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.midias{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 12px;padding:0 18px}
.midias img,.midias video{height:300px;max-width:85%;border-radius:12px;background:var(--creme2);scroll-snap-align:start;flex:none;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--marrom2);margin-bottom:12px;align-items:center}
label.campo{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input.txt,textarea,input[type=datetime-local]{width:100%;padding:11px 12px;border:1px solid var(--creme2);border-radius:12px;background:var(--creme3)}
textarea{min-height:170px;resize:vertical;line-height:1.45}
.conta{font-size:12px;color:var(--marrom2);text-align:right;margin-top:4px}
.conta.alto{color:var(--erro)}
.erro-box{background:#F6DED8;color:var(--erro);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;word-break:break-word}
.ok-box{background:#DCEBDF;color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.secao{border-top:1px solid var(--creme2);margin-top:16px;padding-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--creme3);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--creme2)}th{font-weight:600;color:var(--marrom2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabela{overflow-x:auto;border:1px solid var(--creme2);border-radius:12px}
.log{background:var(--creme3);border:1px solid var(--creme2);border-radius:12px;padding:6px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.log div{padding:5px 0;border-top:1px solid var(--creme2);word-break:break-word}.log div:first-child{border-top:0}
.log .e{color:var(--erro)}.log .o{color:var(--ok)}
svg.graf{width:100%;height:160px;display:block}
.passo{display:flex;gap:12px;margin:12px 0}.passo>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--marrom);color:var(--creme);display:grid;place-items:center;font-size:13px}
.entrada{max-width:560px;margin:24px auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);background:var(--marrom);color:var(--creme);padding:12px 18px;border-radius:12px;box-shadow:var(--sombra);transition:transform .25s;max-width:92vw;z-index:20}
.toast.on{transform:translateX(-50%)}
.oculto{display:none!important}
.form{max-width:720px}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tipos button{border:1px solid var(--creme2);background:var(--creme3);border-radius:12px;padding:10px 6px;font-size:14px}
.tipos button.on{background:var(--marrom);color:var(--creme);border-color:var(--marrom)}
.tipos small{display:block;font-size:11px;opacity:.75}
.solta{display:block;border:2px dashed var(--ouro);border-radius:14px;padding:18px;text-align:center;background:var(--creme3);cursor:pointer;color:var(--marrom2)}
.solta input{display:none}
.solta b{display:block;color:var(--marrom);font-size:15px;margin-bottom:2px}
.previas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.previa{position:relative;width:86px}
.previa img,.previa video{width:86px;height:108px;object-fit:cover;border-radius:10px;background:var(--creme2);display:block}
.previa span{display:block;font-size:11px;color:var(--marrom2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previa button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(74,51,36,.85);color:#fff;line-height:1}
.previa .ordem{position:absolute;top:4px;left:4px;background:rgba(244,236,223,.92);color:var(--marrom);border-radius:8px;padding:0 6px;font-size:12px;font-weight:600}
.lista-arq{background:var(--creme3);border:1px solid var(--creme2);border-radius:12px;padding:4px 12px;margin-top:10px;font-size:14px}
.lista-arq div{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--creme2)}.lista-arq div:first-child{border-top:0}
.lista-arq span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-arq small{color:var(--marrom2);flex:none}
.lista-arq button{border:0;background:none;color:var(--erro);font-size:18px;flex:none}
.check{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--marrom)}
.progresso{background:var(--creme2);border-radius:8px;height:10px;overflow:hidden;margin:10px 0 6px}.progresso i{display:block;height:100%;background:var(--ouro);transition:width .3s}
.dica{font-size:13px;color:var(--marrom2);margin:6px 0 0}
code{background:var(--creme2);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<header>
 <div class="topo">
  <h1>LC Publicador<small id="sub">@lcassessoriabancaria</small></h1>
  <button class="icone" id="btAtualizar" title="Atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
 </div>
 <nav id="abas">
  <button data-aba="agenda" class="on">Agenda</button>
  <button data-aba="novo">+ Novo post</button>
  <button data-aba="importar">Importar calendário</button>
  <button data-aba="numeros">Números</button>
  <button data-aba="registro">Registro</button>
  <button data-aba="ajustes">Ajustes</button>
 </nav>
</header>
<div class="aviso" id="aviso"><span class="ponto"></span><span id="avisoTxt"></span></div>
<main id="main"></main>

<dialog id="dlg"><div class="folha" id="folha"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const DONO='juliolinck', REPO='lc-publicador', BASE='https://juliolinck.github.io/lc-publicador/', META_SEG=3000;
const API='https://api.github.com/repos/'+DONO+'/'+REPO;
const ST={pendente:'na fila',publicado:'publicado',erro:'erro',perdido:'perdido',pausado:'pausado',aplicando:'aplicando…'};
const TIPOS={reel:'Reel',carrossel:'Carrossel',imagem:'Post',story:'Story'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

// ---------- guarda do token neste aparelho ----------
let tokenMem='';
const guardar={
 get(k){try{return localStorage.getItem(k)||''}catch(e){return k==='lc_token'?tokenMem:''}},
 set(k,v){try{localStorage.setItem(k,v)}catch(e){if(k==='lc_token')tokenMem=v}},
 del(k){try{localStorage.removeItem(k)}catch(e){tokenMem=''}}
};
let token=guardar.get('lc_token');

// ---------- estado ----------
const S={fila:[],met:{},log:[],carregado:false,aba:'agenda',filtro:'todos',busca:'',atualizadoEm:null};
const fila={espera:[],envio:null}; // comandos aguardando e lote em andamento
const marcas={}; // id -> 'aplicando'

// ---------- GitHub ----------
async function gh(caminho,opc={}){
 const r=await fetch(API+caminho,{...opc,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':opc.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opc.body?{'Content-Type':'application/json'}:{})}});
 if(r.status===401) throw new Error('A chave de acesso foi recusada pelo GitHub. Confira em Ajustes.');
 if(r.status===403||r.status===404){const t=await r.text();throw new Error(r.status===404?'Não encontrado: '+caminho:'Sem permissão no GitHub ('+(JSON.parse(t||'{}').message||'403')+').')}
 if(!r.ok) throw new Error('GitHub respondeu '+r.status);
 return r;
}
async function arquivo(nome){
 try{const r=await gh('/contents/'+nome+'?ref=main',{raw:true});return await r.text()}
 catch(e){if(/Não encontrado/.test(e.message))return null;throw e}
}
async function disparar(fluxo,inputs){
 await gh('/actions/workflows/'+fluxo+'/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:inputs||{}})});
}

// ---------- envio de arquivos ao repositório (um commit só) ----------
const LIMITE_MB=70;
const mb=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toLocaleString('pt-BR',{maximumFractionDigits:1})+' MB';
function base64(blob){return new Promise((ok,erro)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>erro(new Error('Não consegui ler o arquivo '+(blob.name||'')));r.readAsDataURL(blob)})}
async function commitar(arquivos,mensagem,prog){
 const total=arquivos.reduce((s,a)=>s+a.blob.size,0);let feito=0;const itens=[];
 for(const [k,a] of arquivos.entries()){
  prog&&prog(feito/total,`Enviando ${k+1} de ${arquivos.length} (${mb(a.blob.size)})…`);
  const r=await (await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:await base64(a.blob),encoding:'base64'})})).json();
  itens.push({path:a.path,mode:'100644',type:'blob',sha:r.sha});feito+=a.blob.size;
 }
 prog&&prog(1,'Gravando no GitHub…');
 for(let t=0;t<6;t++){
  try{
   const ref=await (await gh('/git/ref/heads/main')).json();const pai=ref.object.sha;
   const base=await (await gh('/git/commits/'+pai)).json();
   const arv=await (await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:base.tree.sha,tree:itens})})).json();
   const c=await (await gh('/git/commits',{method:'POST',body:JSON.stringify({message:mensagem,tree:arv.sha,parents:[pai]})})).json();
   await gh('/git/refs/heads/main',{method:'PATCH',body:JSON.stringify({sha:c.sha})});
   return c.sha;
  }catch(e){if(t===5||!/422|409/.test(e.message))throw e;await new Promise(r=>setTimeout(r,1500))} // o robô gravou ao mesmo tempo: refaz sobre a versão nova
 }
}
// Imagens viram JPEG (único formato que a API do Instagram aceita) e, no feed, ficam entre 4:5 e 1,91:1.
async function prepararImagem(arq,ajustarFeed){
 const url=URL.createObjectURL(arq);
 const img=await new Promise((ok,erro)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>erro(new Error('Não consegui abrir a imagem '+arq.name+'. Use JPG ou PNG.'));i.src=url});
 let w=img.naturalWidth,h=img.naturalHeight;const esc=Math.min(1,1440/w);w=Math.round(w*esc);h=Math.round(h*esc);
 let W=w,H=h;if(ajustarFeed){if(H/W>1.25)W=Math.round(H/1.25);if(W/H>1.91)H=Math.round(W/1.91)}
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
 cx.fillStyle='#FFFFFF';cx.fillRect(0,0,W,H);cx.drawImage(img,Math.round((W-w)/2),Math.round((H-h)/2),w,h);URL.revokeObjectURL(url);
 return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',.92));
}
const ehVideo=f=>/^video\//.test(f.type)||/\.(mp4|mov|m4v)$/i.test(f.name);
function salvarBlob(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const slug=s=>String(s||'post').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').slice(0,40).toLowerCase()||'post';
async function baixarArquivo(caminho){
 try{const r=await fetch(BASE+caminho,{cache:'no-store'});if(r.ok)return await r.blob()}catch(e){}
 const r=await gh('/contents/'+caminho+'?ref=main',{raw:true});return await r.blob();
}
let zipLib=null;
function carregarZip(){return zipLib||(zipLib=new Promise((ok,erro)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>ok(window.JSZip);s.onerror=()=>{zipLib=null;erro(new Error('Não consegui carregar o compactador.'))};document.head.appendChild(s)}))}

// ---------- carregar dados ----------
async function carregar(silencioso){
 const bt=$('btAtualizar');bt.classList.add('girando');
 try{
  const [f,m,l]=await Promise.all([arquivo('fila.json'),arquivo('metricas.json'),arquivo('registro.log')]);
  S.fila=f?JSON.parse(f).itens:[];S.met=m?JSON.parse(m):{};S.log=(l||'').trim().split('\n').filter(Boolean);
  S.carregado=true;S.atualizadoEm=new Date();
  // reaplica o que ainda está a caminho, para a tela não "voltar"
  if(fila.envio)otimista(fila.envio.lista);otimista(fila.espera);
  if(S.aba==='novo'||S.aba==='importar'){$('sub').textContent='@lcassessoriabancaria · atualizado '+S.atualizadoEm.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}else desenhar();
 }catch(e){if(!silencioso)aviso(e.message,true);if(!S.carregado)desenhar(e.message)}
 finally{bt.classList.remove('girando')}
}

// ---------- comandos ----------
function otimista(cmds){
 for(const c of cmds){
  if(c.cmd==='novo'){if(!S.fila.some(x=>x.id===c.id)){const d=JSON.parse(c.valor);S.fila.push({id:c.id,titulo:d.titulo,tipo:d.tipo,arquivos:d.arquivos,capa:d.capa||'',legenda:d.legenda,quando_local:d.quando,quando_utc:localParaUtc(d.quando),status:'pendente',erro:'',resultado:{}})}marcas[c.id]='aplicando';continue}
  const i=S.fila.find(x=>x.id===c.id);if(!i)continue;
  marcas[c.id]='aplicando';
  if(c.cmd==='pausar')i.status='pausado';
  else if(c.cmd==='retomar'&&i.status==='pausado')i.status='pendente';
  else if(c.cmd==='repetir'){i.status='pendente';i.erro=''}
  else if(c.cmd==='mover'){i.quando_local=c.valor;i.quando_utc=localParaUtc(c.valor);if(i.status==='erro'||i.status==='perdido')i.status='pendente'}
  else if(c.cmd==='agora'){const a=agoraLocal();i.quando_local=a;i.quando_utc=localParaUtc(a);i.status='pendente'}
  else if(c.cmd==='legenda')i.legenda=c.valor;
  else if(c.cmd==='titulo')i.titulo=c.valor;
  else if(c.cmd==='remover')S.fila=S.fila.filter(x=>x.id!==c.id);
 }
 S.fila.sort((a,b)=>a.quando_utc<b.quando_utc?-1:1);
}
function enviar(cmds){
 fila.espera.push(...cmds);otimista(cmds);desenhar();
 if(!fila.envio)proximoLote();else barra();
}
async function proximoLote(){
 if(!fila.espera.length){fila.envio=null;barra();return}
 const lista=fila.espera.splice(0);
 fila.envio={lista,t0:Date.now(),run:null,tent:0};
 await mandar();
}
function resumo(lista){const r=lista.map(c=>c.cmd+' '+c.id).join(', ');return r.length>90?lista.length+' ajustes':r}
async function mandar(){
 const e=fila.envio;barra();
 try{e.t0=Date.now();e.run=null;await disparar('gerenciar.yml',{comandos:JSON.stringify(e.lista),resumo:resumo(e.lista)});vigiar()}
 catch(err){aviso('Não consegui enviar: '+err.message,true);devolver(e.lista)}
}
function devolver(lista){for(const c of lista)delete marcas[c.id];fila.envio=null;carregar(true);if(fila.espera.length)proximoLote();else barra()}
async function vigiar(){
 const e=fila.envio;if(!e)return;
 try{
  if(!e.run){
   const r=await (await gh('/actions/workflows/gerenciar.yml/runs?event=workflow_dispatch&per_page=10')).json();
   const c=(r.workflow_runs||[]).filter(x=>new Date(x.created_at).getTime()>=e.t0-15000).sort((a,b)=>a.created_at<b.created_at?-1:1);
   if(c.length)e.run=c[0].id;
   else if(Date.now()-e.t0>180000){aviso('O GitHub não iniciou a alteração. Tente de novo.',true);return devolver(e.lista)}
  }
  if(e.run){
   const run=await (await gh('/actions/runs/'+e.run)).json();
   if(run.status==='completed'){
    if(run.conclusion==='success'){for(const c of e.lista)delete marcas[c.id];fila.envio=null;aviso(e.lista.length>1?'Alterações aplicadas.':'Alteração aplicada.');await carregar(true);return proximoLote()}
    if(run.conclusion==='cancelled'&&e.tent<5){e.tent++;return mandar()} // o GitHub cancela pedidos em espera quando chega outro: reenviamos
    aviso('A alteração falhou no GitHub. Veja em Registro ou em Ajustes > Execuções.',true);return devolver(e.lista)
   }
  }
 }catch(err){/* rede instável: tenta de novo */}
 setTimeout(vigiar,5000);
}

function acrescentarArquivos(lista){

 for(const f of lista){

  N.arqs.push({file:f,url:URL.createObjectURL(f),video:v});
 }

async function importarCal(){
 if(!I.planilha)return aviso('Escolha a planilha.',true);
 if(!/\.xlsx$/i.test(I.planilha.name))return aviso('A planilha precisa ser um arquivo .xlsx (Excel). No Google Planilhas: Arquivo > Fazer download > Microsoft Excel.',true);
 const grandes=[I.planilha,...I.arqs].filter(f=>f.size>LIMITE_MB*1048576);
 if(grandes.length)return aviso(`${grandes[0].name} passa de ${LIMITE_MB} MB. Divida em zips menores (por semana, por exemplo).`,true);
 I.fase='enviando';I.prog=0;I.msg='Preparando…';I.resultado=[];desenhar();
 try{
  const lim=n=>n.replace(/[\\/:*?"<>|]+/g,'_');
  const envio=[{path:'entrada/'+lim(I.planilha.name),blob:I.planilha},...I.arqs.map(f=>({path:'entrada/'+lim(f.name),blob:f}))];
  I.t0=Date.now();
  await commitar(envio,'Calendário enviado pelo app: '+I.planilha.name,(p,m)=>{I.prog=p*.8;I.msg=m;if(S.aba==='importar')desenhar()});
  I.fase='importando';I.prog=.85;I.msg='O GitHub está lendo a planilha e copiando as mídias…';I.run=null;I.tent=0;desenhar();
  vigiarImportacao();
 }catch(e){I.fase='falhou';I.msg='Não consegui enviar: '+e.message;desenhar()}
}
async function vigiarImportacao(){
 try{
  if(!I.run){
   const r=await (await gh('/actions/workflows/importar.yml/runs?per_page=10')).json();
   const c=(r.workflow_runs||[]).filter(x=>new Date(x.created_at).getTime()>=I.t0-15000).sort((a,b)=>a.created_at<b.created_at?-1:1);
   if(c.length)I.run=c[0].id;else if(Date.now()-I.t0>180000){await disparar('importar.yml');I.t0=Date.now()}
  }
  if(I.run){
   const run=await (await gh('/actions/runs/'+I.run)).json();
   if(run.status==='completed'){
    if(run.conclusion==='cancelled'&&I.tent<5){I.tent++;I.run=null;I.t0=Date.now();await disparar('importar.yml')} // o GitHub cancelou porque o robô estava rodando: pede de novo
    else if(run.conclusion==='success'){
     await carregar(true);const L=S.log;let k=-1;for(let j=L.length-1;j>=0;j--)if(/IMPORTAÇÃO /.test(L[j])&&!/IMPORTAÇÃO problema/.test(L[j])){k=j;break}
     I.resultado=k>=0?L.slice(k).filter(l=>/IMPORTAÇÃO/.test(l)).map(l=>l.replace(/^\S+ \S+ IMPORTAÇÃO (problema: )?/,(m,p)=>p?'Problema: ':'')):[];
     I.fase='pronto';I.prog=1;I.planilha=null;I.arqs=[];desenhar();aviso('Calendário importado.');return}
    else{I.fase='falhou';I.msg='A importação falhou no GitHub. Confira a planilha (aba "Calendário", cabeçalho na linha 4) e veja os detalhes em Ajustes > Execuções no GitHub.';desenhar();return}
   }else{I.prog=Math.min(.97,I.prog+.02);if(S.aba==='importar')desenhar()}
  }
 }catch(e){}
 setTimeout(vigiarImportacao,5000);
}

   for(const a of arqs){z.file(a.split('/').pop(),await baixarArquivo(a))}
   z.file('legenda.txt',(i.legenda||'')+'\n');salvarBlob(await z.generateAsync({type:'blob'}),nome+'.zip')}
 }catch(e){aviso('Não consegui baixar: '+e.message,true)}
 finally{bt.disabled=false;bt.textContent=t}
}
function baixarCalendario(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const linhas=[['Data','Horário','Código','Tipo','Título','Status','Legenda','Link'].map(q).join(';')];
 for(const i of S.fila)linhas.push([i.quando_local.slice(0,10),i.quando_local.slice(11),i.id,TIPOS[i.tipo]||i.tipo,i.titulo,ST[i.status]||i.status,i.legenda||'',((i.resultado||{}).instagram||{}).link||''].map(q).join(';'));
 salvarBlob(new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'}),'calendario-lc-'+new Date().toISOString().slice(0,10)+'.csv');
}

function telaNumeros(){
 const s=S.met.seguidores||[];let graf='<div class="card">O gráfico aparece a partir do 2º dia de coleta (os números são lidos todo dia por volta das 8h45).</div>';
 if(s.length>=2){const v=s.map(x=>x.total||0),mn=Math.min(...v),mx=Math.max(...v,mn+1);
  const pts=v.map((y,i)=>`${(i/(v.length-1)*580+10).toFixed(1)},${(150-(y-mn)/(mx-mn)*130).toFixed(1)}`).join(' ');
  graf=`<div class="card"><svg class="graf" viewBox="0 0 600 160" preserveAspectRatio="none"><polyline fill="none" stroke="#A8834F" stroke-width="3" vector-effect="non-scaling-stroke" points="${pts}"/></svg>
  <div class="linha" style="font-size:12px;color:var(--marrom2)"><span>${esc(s[0].dia.split('-').reverse().join('/'))}: ${s[0].total}</span><span style="text-align:right">${esc(s.at(-1).dia.split('-').reverse().join('/'))}: ${s.at(-1).total}</span></div></div>`}
 const pub=S.fila.filter(i=>i.status==='publicado');const P=S.met.posts||{};
 const n=v=>v==null?'—':Number(v).toLocaleString('pt-BR');
 const linhas=pub.slice().reverse().map(i=>{const m=P[i.id]||{};const l=((i.resultado||{}).instagram||{}).link;
  return `<tr><td>${esc(i.quando_local.slice(0,5))}</td><td>${l?`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(i.titulo)}</a>`:esc(i.titulo)}</td><td class="n">${n(m.reach)}</td><td class="n">${n(m.likes)}</td><td class="n">${n(m.comments)}</td><td class="n">${n(m.saved)}</td><td class="n">${n(m.shares)}</td><td class="n">${n(m.views)}</td></tr>`}).join('');
 return `<h2 style="margin-top:4px">Seguidores</h2>${graf}
 <div class="linha" style="margin-top:10px"><button class="btn sec" id="btMetricas">Atualizar números agora</button></div>
 <h2>Desempenho dos posts</h2>
 ${pub.length?`<div class="tabela"><table><thead><tr><th>Dia</th><th>Post</th><th class="n">Alcance</th><th class="n">Curtidas</th><th class="n">Coment.</th><th class="n">Salvos</th><th class="n">Compart.</th><th class="n">Views</th></tr></thead><tbody>${linhas}</tbody></table></div>`:'<div class="card">Ainda não há posts publicados.</div>'}`;
}

function telaRegistro(){
 const L=S.log.slice(-150).reverse();
 return `<h2 style="margin-top:4px">Últimos acontecimentos</h2>
 <div class="log">${L.map(x=>`<div class="${/ERRO|FALHOU|PERDIDO|falhou/.test(x)?'e':/^\S+ \S+ OK /.test(x)?'o':''}">${esc(x)}</div>`).join('')||'<div>Nada registrado ainda.</div>'}</div>`;
}

function telaAjustes(){
 return `<h2 style="margin-top:4px">Robô</h2>
 <div class="card">O robô verifica a fila a cada 10 minutos e publica o que estiver na hora. Use o botão abaixo para ele olhar agora.
  <div class="linha" style="margin-top:12px"><button class="btn" id="btVerificar">Verificar a fila agora</button></div></div>
 <h2>Links</h2>
 <div class="card"><div class="linha">
  <a class="btn sec" style="text-align:center;text-decoration:none" href="${BASE}" target="_blank" rel="noopener">Painel público</a>
  <a class="btn sec" style="text-align:center;text-decoration:none" href="https://github.com/${DONO}/${REPO}/actions" target="_blank" rel="noopener">Execuções no GitHub</a>
  <a class="btn sec" style="text-align:center;text-decoration:none" href="https://www.instagram.com/lcassessoriabancaria/" target="_blank" rel="noopener">Abrir o Instagram</a>
 </div></div>
 <h2>Instalar no celular</h2>
 <div class="card"><b>iPhone:</b> abra este endereço no Safari, toque em Compartilhar e depois em <i>Adicionar à Tela de Início</i>.<br><br>
 <b>Android:</b> abra no Chrome, toque nos três pontinhos e depois em <i>Instalar app</i> (ou <i>Adicionar à tela inicial</i>).<br><br>
 Endereço: <code>${BASE}app/</code></div>
 <h2>Este aparelho</h2>
 <div class="card">A chave de acesso fica guardada só neste aparelho e só é enviada ao GitHub.
  <div class="linha" style="margin-top:12px"><button class="btn perigo" id="btSair">Remover a chave deste aparelho</button></div></div>`;
}

function telaEntrada(msg){
 return `<div class="entrada">
 <h2 style="margin-top:0">Primeiro acesso neste aparelho</h2>
 <p>O app precisa de uma <b>chave de acesso do GitHub</b> que só sirva para o LC Publicador. Você cria uma vez e cola aqui. Leva 2 minutos.</p>
 ${msg?`<div class="erro-box">${esc(msg)}</div>`:''}
 <div class="card">
  <div class="passo"><b>1</b><div>Logado no GitHub como <b>${DONO}</b>, abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</div></div>
  <div class="passo"><b>2</b><div><b>Token name:</b> <code>LC Publicador app</code>. <b>Expiration:</b> escolha <i>No expiration</i> ou 1 ano.</div></div>
  <div class="passo"><b>3</b><div><b>Repository access:</b> marque <i>Only select repositories</i> e escolha <code>${REPO}</code>.</div></div>
  <div class="passo"><b>4</b><div>Em <b>Permissions</b>, clique em <i>Add permissions</i> e marque <b>Actions</b> e <b>Contents</b>. Depois mude as duas para <i>Read and write</i>.</div></div>
  <div class="passo"><b>5</b><div>Clique em <b>Generate token</b>, copie o código (começa com <code>github_pat_</code>) e cole abaixo.</div></div>
 </div>
 <label class="campo" for="tk">Chave de acesso</label>
 <input class="txt" id="tk" type="password" autocomplete="off" placeholder="github_pat_...">
 <div class="linha" style="margin-top:12px"><button class="btn" id="btEntrar">Entrar</button></div>
 <p style="font-size:13px;color:var(--marrom2)">A chave fica guardada só neste aparelho. Ela só abre o repositório do LC Publicador: não mexe em nenhum outro repositório nem na sua conta.</p>
 </div>`;
}

function desenhar(erro){
 const m=$('main');$('abas').classList.toggle('oculto',!token);
 if(!token){m.innerHTML=telaEntrada();return}
 if(!S.carregado){m.innerHTML=erro?`<div class="erro-box">${esc(erro)}</div><button class="btn" onclick="carregar()">Tentar de novo</button>`:'<div class="vazio">Carregando…</div>';return}
 $('sub').textContent='@lcassessoriabancaria · atualizado '+S.atualizadoEm.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 const foco=document.activeElement&&document.activeElement.id==='busca';const pos=foco?document.activeElement.selectionStart:0;
 m.innerHTML={agenda:telaAgenda,novo:telaNovo,importar:telaImportar,numeros:telaNumeros,registro:telaRegistro,ajustes:telaAjustes}[S.aba]();
 if(foco){const b=$('busca');b.focus();b.setSelectionRange(pos,pos)}
 if($('dlg').open&&aberto)abrir(aberto,true);
}

// ---------- detalhe do post ----------
let aberto=null;
function abrir(id,manter){
 const i=S.fila.find(x=>x.id===id);if(!i){$('dlg').close();return}
 aberto=id;const pub=i.status==='publicado',ap=!!marcas[id];
 const leg=manter&&$('leg')?$('leg').value:(i.legenda||'');const tit=manter&&$('titu')?$('titu').value:i.titulo;const dt=manter&&$('quando')?$('quando').value:localParaInput(i.quando_local);
 const midias=(i.arquivos_removidos?[]:(i.arquivos||[])).map(a=>/\.(mp4|mov|m4v)$/i.test(a)?`<video src="${esc(BASE+a)}" ${i.capa?`poster="${esc(BASE+i.capa)}"`:''} controls playsinline preload="metadata"></video>`:`<img src="${esc(BASE+a)}" alt="" loading="lazy">`).join('');
 const r=(i.resultado||{}).instagram||{};const m=(S.met.posts||{})[id]||{};
 $('folha').innerHTML=`<header><h2>${esc(i.titulo)}</h2><button class="fechar" aria-label="Fechar" onclick="fechar()">×</button></header>
 ${midias?`<div class="midias">${midias}</div>`:''}
 <div class="meta"><span class="st ${status(i)}">${ST[status(i)]||esc(i.status)}</span><span>${esc(TIPOS[i.tipo]||i.tipo)} · ${esc(i.id)}</span><span>${esc(nomeDia(i.quando_local.slice(0,10)))} às ${esc(i.quando_local.slice(11))}</span>${i.validar_juridico?'<span>⚖️ conferir com o jurídico</span>':''}</div>
 ${ap?'<div class="ok-box">Há uma alteração deste post a caminho do GitHub. Aguarde 1 a 2 minutos.</div>':''}
 ${i.erro?`<div class="erro-box">${esc(i.erro)}</div>`:''}
 <div class="linha" style="margin-bottom:12px"><button class="btn sec" data-acao="baixar" ${i.arquivos_removidos?'disabled':''}>Baixar arquivos</button><button class="btn sec" data-acao="copiar">Copiar legenda</button></div>
 ${pub?`<div class="ok-box">Publicado${r.em?' em '+esc(new Date(r.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})):''}.${m.reach!=null?` Alcance ${m.reach}, ${m.likes??0} curtidas, ${m.comments??0} comentários, ${m.saved??0} salvos.`:''} ${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">Ver no Instagram</a>`:''}</div>`:''}
 ${pub?`<label class="campo">Legenda publicada</label><div class="card" style="white-space:pre-wrap">${esc(i.legenda||'')}</div>`:`
 <div class="linha">
  ${i.status==='pausado'?'<button class="btn ouro" data-acao="retomar">Retomar</button>':'<button class="btn sec" data-acao="pausar">Pausar</button>'}
  <button class="btn" data-acao="agora">Publicar agora</button>
  ${i.status==='erro'||i.status==='perdido'?'<button class="btn ouro" data-acao="repetir">Tentar de novo</button>':''}
 </div>
 <label class="campo" for="quando">Data e hora (Brasília)</label>
 <div class="linha"><input id="quando" type="datetime-local" value="${esc(dt)}" step="60"><button class="btn sec" data-acao="mover" style="flex:0 0 auto">Mudar horário</button></div>
 <label class="campo" for="titu">Título interno</label>
 <input class="txt" id="titu" value="${esc(tit)}">
 <label class="campo" for="leg">Legenda</label>
 <textarea id="leg">${esc(leg)}</textarea>
 <div class="conta" id="conta"></div>
 <div class="linha" style="margin-top:10px"><button class="btn" data-acao="salvar">Salvar título e legenda</button></div>
 <div class="secao"><div class="linha" style="margin-top:12px"><button class="btn perigo" data-acao="remover">Remover da fila</button></div></div>`}`;
 contar();
 if(!$('dlg').open)$('dlg').showModal();
}
function fechar(){aberto=null;$('dlg').close()}
function contar(){const t=$('leg');if(!t)return;const n=[...t.value].length,h=(t.value.match(/#[\p{L}\p{N}_]+/gu)||[]).length;
 const c=$('conta');c.textContent=`${n.toLocaleString('pt-BR')} / 2.200 caracteres · ${h} / 30 hashtags`;c.classList.toggle('alto',n>2200||h>30)}
$('dlg').addEventListener('input',e=>{if(e.target.id==='leg')contar()});
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))fechar()});
$('dlg').addEventListener('close',()=>{aberto=null});
$('dlg').addEventListener('click',e=>{
 const b=e.target.closest('[data-acao]');if(!b||!aberto)return;
 const i=S.fila.find(x=>x.id===aberto);const a=b.dataset.acao;const id=aberto;
 if(a==='baixar')return baixarPost(i,b);
 if(a==='copiar'){const t=$('leg')?$('leg').value:(i.legenda||'');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>aviso('Legenda copiada.'),()=>aviso('Não consegui copiar. Selecione o texto e copie.',true));return}
 if(a==='mover'){const v=$('quando').value;if(!v)return aviso('Escolha a data e a hora.',true);const loc=inputParaLocal(v);
  if(new Date(localParaUtc(loc))<new Date(Date.now()-60000)&&!confirm('Esse horário já passou. O post será publicado na próxima rodada do robô. Continuar?'))return;
  enviar([{cmd:'mover',id,valor:loc}]);aviso('Horário alterado para '+loc+'.')}
 else if(a==='agora'){if(!confirm('Publicar "'+i.titulo+'" agora no Instagram?'))return;enviar([{cmd:'agora',id}]);aviso('Enviado. O post sai em 1 a 3 minutos.')}
 else if(a==='salvar'){const c=[];const t=$('titu').value.trim(),l=$('leg').value.trim();
  if(!l)return aviso('A legenda não pode ficar vazia.',true);
  if([...l].length>2200)return aviso('O Instagram aceita até 2.200 caracteres.',true);
  if(t&&t!==i.titulo)c.push({cmd:'titulo',id,valor:t});if(l!==(i.legenda||'').trim())c.push({cmd:'legenda',id,valor:l});
  if(!c.length)return aviso('Nada mudou.');enviar(c);aviso('Salvo. Aplicando no GitHub…')}
 else if(a==='remover'){if(!confirm('Remover "'+i.titulo+'" da fila? Ele não será publicado.'))return;enviar([{cmd:'remover',id}]);fechar();aviso('Removido da fila.')}
 else {enviar([{cmd:a,id}]);aviso({pausar:'Pausado.',retomar:'Retomado.',repetir:'Vai tentar de novo na próxima rodada.'}[a]||'Enviado.')}
});

// ---------- eventos gerais ----------
function marcarAba(){document.querySelectorAll('#abas button').forEach(x=>x.classList.toggle('on',x.dataset.aba===S.aba))}
$('abas').addEventListener('click',e=>{const b=e.target.closest('[data-aba]');if(!b)return;S.aba=b.dataset.aba;marcarAba();desenhar();scrollTo(0,0)});
$('btAtualizar').addEventListener('click',()=>token&&carregar());
$('main').addEventListener('click',async e=>{
 const p=e.target.closest('[data-id]');if(p)return abrir(p.dataset.id);
 const f=e.target.closest('[data-filtro]');if(f){S.filtro=f.dataset.filtro;return desenhar()}
 const tp=e.target.closest('[data-tipo]');if(tp&&!N.enviando){N.tipo=tp.dataset.tipo;const R=REGRAS[N.tipo];
  const fica=N.arqs.filter(a=>N.tipo==='story'||(N.tipo==='reel'?a.video:!a.video)).slice(0,R.max);N.arqs.filter(a=>!fica.includes(a)).forEach(a=>URL.revokeObjectURL(a.url));N.arqs=fica;return desenhar()}
 const tr=e.target.closest('[data-tirar]');if(tr){e.preventDefault();const [x]=N.arqs.splice(+tr.dataset.tirar,1);URL.revokeObjectURL(x.url);return desenhar()}
 const ti=e.target.closest('[data-tirarimp]');if(ti){e.preventDefault();I.arqs.splice(+ti.dataset.tirarimp,1);return desenhar()}
 const id=e.target.id;
 if(id==='btCsv')return baixarCalendario();
 if(id==='btCriar')return criarPost();
 if(id==='btLimpar'){limparNovo();return desenhar()}
 if(id==='btImportar')return importarCal();
 if(id==='btEntrar'){const v=$('tk').value.trim();if(!v)return;token=v;
  try{await gh('');guardar.set('lc_token',v);desenhar();carregar()}catch(err){token='';$('main').innerHTML=telaEntrada(err.message)}}
 if(id==='btSair'&&confirm('Remover a chave deste aparelho? Para voltar a usar o app aqui, será preciso colar a chave de novo.')){guardar.del('lc_token');token='';S.carregado=false;desenhar()}
 if(id==='btVerificar'||id==='btMetricas'){const b=e.target;b.disabled=true;
  try{await disparar(id==='btVerificar'?'publicar.yml':'metricas.yml');aviso(id==='btVerificar'?'O robô vai olhar a fila agora. Atualize em 1 a 2 minutos.':'Coletando os números. Atualize em 1 a 2 minutos.');setTimeout(()=>carregar(true),90000)}
  catch(err){aviso(err.message,true)}finally{setTimeout(()=>b.disabled=false,4000)}}
});
$('main').addEventListener('input',e=>{const t=e.target;
 if(t.id==='busca'){S.busca=t.value;desenhar()}
 else if(t.id==='novoTit')N.titulo=t.value;
 else if(t.id==='novoQuando')N.quando=t.value;
 else if(t.id==='novoLeg'){N.legenda=t.value;const n=[...t.value].length,h=(t.value.match(/#[\p{L}\p{N}_]+/gu)||[]).length;const c=$('novoConta');c.textContent=`${n.toLocaleString('pt-BR')} / 2.200 caracteres · ${h} / 30 hashtags`;c.classList.toggle('alto',n>2200||h>30)}});
$('main').addEventListener('change',e=>{const t=e.target;
 if(t.id==='novoArq'){acrescentarArquivos([...t.files]);desenhar()}
 else if(t.id==='novoCapa'&&t.files[0]){if(N.capa)URL.revokeObjectURL(N.capa.url);N.capa={file:t.files[0],url:URL.createObjectURL(t.files[0])};desenhar()}
 else if(t.id==='novoLogo'){N.logo=t.checked;desenhar()}
 else if(t.id==='impPlan'&&t.files[0]){I.planilha=t.files[0];if(I.fase!=='enviando'&&I.fase!=='importando')I.fase='';desenhar()}
 else if(t.id==='impArq'){const nomes=new Set(I.arqs.map(f=>f.name));for(const f of t.files)if(!nomes.has(f.name))I.arqs.push(f);if(I.fase==='pronto'||I.fase==='falhou')I.fase='';desenhar()}});
$('main').addEventListener('keydown',e=>{if(e.target.id==='tk'&&e.key==='Enter')$('btEntrar').click()});
let tt;function aviso(t,erro){const el=$('toast');el.textContent=t;el.style.background=erro?'var(--erro)':'';el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),erro?6000:3000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)carregar(true)});
setInterval(()=>{if(!document.hidden&&token&&!$('dlg').open)carregar(true)},60000);

desenhar();if(token)carregar();
</script>
</body>
